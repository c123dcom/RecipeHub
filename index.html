let active="All";
const cats=["All",...new Set(recipes.map(r=>r.cat))];
function initCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("")}
function setCat(c){active=c;initCats();render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=recipes.filter(r=>(active==="All"||r.cat===active)&&(!q||(r.name+" "+r.cat+" "+r.ingredients.join(" ")).toLowerCase().includes(q)));
 document.getElementById("count").textContent=list.length+" matching";document.getElementById("grid").innerHTML=list.length?list.map((r,i)=>`<article class="card"><span class="tag">${r.cat} • ${r.time}</span><h2>${r.name}</h2><p>${r.veg?"🥬 Vegetarian":"🍗 Non-Veg"}</p><p>${r.ingredients.slice(0,4).join(", ")}${r.ingredients.length>4?"…":""}</p><button onclick="show(${recipes.indexOf(r)})">View Recipe</button></article>`).join(""):`<div class="card"><h2>No recipe found</h2><p>Try another recipe or ingredient.</p></div>`;
}
function show(i){
 const r=recipes[i];
 document.getElementById("detail").innerHTML=`<span class="tag">${r.cat} • ${r.time}</span><h1>${r.name}</h1><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${x}</li>`).join("")}</ul><h3>Steps</h3><ol class="steps">${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol><a href="${r.video}" target="_blank"><button>🎥 Find Video</button></a>`;
 document.getElementById("modal").style.display="block";
}
function closeModal(){document.getElementById("modal").style.display="none"}
document.getElementById("search").addEventListener("input",render);initCats();render();
</script>
